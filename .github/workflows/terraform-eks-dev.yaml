name: "Terraform EKS Dev Cluster"

on:
  workflow_dispatch:
    inputs:
      action:
        # No destroy: the VPC has prevent_destroy. Turn the cluster off with enabled = false in terraform.tfvars.
        description: 'plan only, or plan then apply (enabled in terraform.tfvars turns the cluster on or off)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
  pull_request:
    branches:
      - main
    paths:
      - "eks-dev/**"
      - ".github/workflows/terraform-eks-dev.yaml"
  push:
    branches:
      - main
    paths:
      - "eks-dev/**"
      - ".github/workflows/terraform-eks-dev.yaml"

env:
  AWS_DEFAULT_REGION: us-east-2

# One run at a time against this state; never cancel a run mid-apply.
concurrency:
  group: eks-dev
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Job 1: Plan (every trigger). Merges only ever plan.
  # ------------------------------------------------------------------
  plan:
    name: "EKS Dev Plan"
    runs-on: ubuntu-latest
    # Holds AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, and the ADMIN_CIDR variable.
    # No required reviewers here: they would also block PR plans.
    environment: eks-dev
    defaults:
      run:
        working-directory: eks-dev

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # The apply job applies exactly this file. It can hold variable values in
      # plain text, so keep retention short.
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-eks-dev
          path: eks-dev/tfplan
          retention-days: 5

  # ------------------------------------------------------------------
  # Job 2: Apply the saved plan (manual dispatch with apply only)
  # ------------------------------------------------------------------
  apply:
    name: "Terraform Apply"
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: ubuntu-latest
    environment: eks-dev
    defaults:
      run:
        working-directory: eks-dev

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-eks-dev
          path: eks-dev

      # A saved plan carries its own variables and needs no approval flag.
      # Terraform refuses it if state changed since the plan was made.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
