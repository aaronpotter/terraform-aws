name: "Terraform EKS Dev Cluster"

on:
  workflow_dispatch:
    inputs:
      action:
        # No destroy: the VPC has prevent_destroy. Turn the cluster off with enabled = false in terraform.tfvars.
        description: 'plan only, or plan then apply (enabled in terraform.tfvars turns the cluster on or off)'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
  # Path filtering happens in the changes job, not here (see below).
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_DEFAULT_REGION: us-east-2

# id-token lets jobs request the OIDC token that configure-aws-credentials exchanges for a role.
permissions:
  id-token: write
  contents: read

# One run at a time against this state; never cancel a run mid-apply.
concurrency:
  group: eks-dev
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Job 0: Decide whether this workflow's plan is relevant.
  # Filtering here instead of with on.paths keeps the plan check reporting on every
  # PR: a job skipped by `if:` counts as passing for required status checks, while a
  # workflow skipped by paths never reports and blocks the PR.
  # ------------------------------------------------------------------
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only eks-dev/ and this workflow affect the cluster.
      - name: Filter Changed Paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if [ -n "$(echo "$changed" | grep -E '^(eks-dev/|\.github/workflows/terraform-eks-dev\.yaml$)')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Job 1: Plan. Merges only ever plan.
  # ------------------------------------------------------------------
  plan:
    name: "EKS Dev Plan"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Holds AWS_ROLE_ARN (terraform-plan) and the ADMIN_CIDR variable.
    # No required reviewers here: they would also block PR plans.
    environment: eks-dev
    defaults:
      run:
        working-directory: eks-dev

    env:
      TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Short-lived credentials via GitHub OIDC; the role comes from the job's environment.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # The apply job applies exactly this file. It can hold variable values in
      # plain text, so keep retention short.
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-eks-dev
          path: eks-dev/tfplan
          retention-days: 5

  # ------------------------------------------------------------------
  # Job 2: Apply the saved plan (manual dispatch with apply only)
  # ------------------------------------------------------------------
  apply:
    name: "Terraform Apply"
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.action != 'plan'
    runs-on: ubuntu-latest
    # Deployable only from main (environment branch policy). eks-dev stays open to all
    # branches because PR plans run on refs/pull/*.
    environment: eks-dev-apply
    defaults:
      run:
        working-directory: eks-dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Short-lived credentials via GitHub OIDC; the role comes from the job's environment.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-eks-dev
          path: eks-dev

      # A saved plan carries its own variables and needs no approval flag.
      # Terraform refuses it if state changed since the plan was made.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
