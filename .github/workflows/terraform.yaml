name: "Terraform Multi-Environment Pipeline"

on:
  # Manual runs plan production and never apply.
  workflow_dispatch:
  # Path filtering happens in the changes job, not here (see below).
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_DEFAULT_REGION: us-east-2

# id-token lets jobs request the OIDC token that configure-aws-credentials exchanges for a role.
permissions:
  id-token: write
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Job 0: Decide whether this workflow's plan is relevant.
  # Filtering here instead of with on.paths keeps the plan check reporting on every
  # PR: a job skipped by `if:` counts as passing for required status checks, while a
  # workflow skipped by paths never reports and blocks the PR.
  # ------------------------------------------------------------------
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Anything outside eks-dev/ and account/ can affect the shared root module.
      # (eks-dev/ has its own workflow; account/ is applied only by a human, never by CI.)
      - name: Filter Changed Paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if [ -n "$(echo "$changed" | grep -vE '^(eks-dev/|account/|\.github/workflows/terraform-eks-dev\.yaml$)')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  # ------------------------------------------------------------------
  # Job 1: Terraform Plan (Runs on Pull Requests & Pushes)
  # ------------------------------------------------------------------
  plan:
    name: "Main Plan"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Secrets and variables live in GitHub environments; the job must declare one to read them.
    # Every run plans production state. production-plan has no reviewers, so PR plans don't wait
    # for approval; only the apply job uses the protected production environment.
    environment: production-plan

    env:
      ENV_NAME: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Short-lived credentials via GitHub OIDC; the role comes from the job's environment.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false -backend-config=environments/${{ env.ENV_NAME }}/backend.tfvars

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var-file=environments/${{ env.ENV_NAME }}/terraform.tfvars -out=tfplan
        env:
          # Kept out of the committed tfvars so an address never lands in the repo.
          TF_VAR_ssh_cidr: ${{ vars.SSH_CIDR }}

      # The apply job applies exactly this file. It can hold variable values in
      # plain text, so keep retention short.
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENV_NAME }}
          path: tfplan
          retention-days: 5

  # ------------------------------------------------------------------
  # Job 2: Production Apply (Runs ONLY when merged to main)
  # ------------------------------------------------------------------
  apply-production:
    name: "Terraform Apply - Production"
    needs: plan
    # Only run on pushes (merges) to the main branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production # Uses GitHub Environment protection rules

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Short-lived credentials via GitHub OIDC; the role comes from the job's environment.
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false -backend-config=environments/production/backend.tfvars

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-production

      # A saved plan carries its own variables and needs no approval flag.
      # Terraform refuses it if state changed since the plan was made.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
