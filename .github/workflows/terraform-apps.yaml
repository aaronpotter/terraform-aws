name: "Terraform Apps"

# apps/: the s3-trigger-unzip Lambda and its buckets, the hello-world ECR repository, and the
# github-actions-deploy role. Same flow as the root module: plan on every PR (read-only role via
# production-plan), apply on merge to main after approval in the production environment.

on:
  # Manual runs plan only.
  workflow_dispatch:
  # Path filtering happens in the changes job, not here, so the plan check always reports.
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  AWS_DEFAULT_REGION: us-east-2

permissions:
  id-token: write
  contents: read

jobs:
  changes:
    name: "Detect Changes"
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Only apps/ and this workflow affect this stack.
      - name: Filter Changed Paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] || [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" "$HEAD")
          echo "$changed"
          if [ -n "$(echo "$changed" | grep -E '^(apps/|\.github/workflows/terraform-apps\.yaml$)')" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  plan:
    name: "Apps Plan"
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # AWS_ROLE_ARN here is the read-only terraform-plan role.
    environment: production-plan
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -out=tfplan

      # The apply job applies exactly this plan, and needs the Lambda zip it references.
      - name: Upload Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-apps
          path: |
            apps/tfplan
            apps/build/
          retention-days: 5

  apply:
    name: "Terraform Apply - Apps"
    # Only applies queue behind each other; plans run in parallel (Terraform's state lock already
    # serializes state access). Workflow-wide concurrency made a pending apply approval block every
    # PR's plan check. Never cancel a run mid-apply.
    concurrency:
      group: apps-apply
      cancel-in-progress: false
    needs: plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # AWS_ROLE_ARN here is terraform-apply; main only, required reviewer.
    environment: production
    defaults:
      run:
        working-directory: apps

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-2
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.4"

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-apps
          path: apps

      # A saved plan carries its own variables and needs no approval flag.
      # Terraform refuses it if state changed since the plan was made.
      - name: Terraform Apply
        run: terraform apply -input=false tfplan
